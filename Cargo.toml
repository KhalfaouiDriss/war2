[workspace]
resolver = "2"
members = [
    "sim",
    "gateway",
    "shard",
    "state-service",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1.0"
postcard = { version = "1.0", features = ["use-std"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
redis = { version = "0.25", features = ["tokio-comp", "streams"] }
axum = "0.7"
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }
rustls = "0.23"
pem = "1.0"
blake3 = "1.5"
zstd = "0.13"
ahash = "0.8"
parking_lot = "0.12"
dashmap = "5.5"
rayon = "1.10"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9.2"
rand = "0.8"
once_cell = "1.19"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true